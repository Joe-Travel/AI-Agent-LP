<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テストページ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  h1 {
    font-size: 28px;
    color: #2d2d2d;
    margin-bottom: 12px;
  }
  p {
    color: #666;
    line-height: 1.7;
    margin-bottom: 24px;
  }
  .badge {
    display: inline-block;
    background: #667eea;
    color: #fff;
    font-size: 13px;
    padding: 6px 16px;
    border-radius: 999px;
    margin-bottom: 20px;
  }
  .btn {
    display: inline-block;
    background: #764ba2;
    color: #fff;
    text-decoration: none;
    padding: 12px 32px;
    border-radius: 8px;
    font-weight: 600;
    transition: transform 0.2s;
  }
  .btn:hover { transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">TEST PAGE</span>
    <h1>公開テスト成功🎉</h1>
    <p>このページが表示されていれば、GitHub Pagesでの公開はうまくいっています。あとはこの内容を、実際に公開したい内容に置き換えるだけです。</p>
    <a class="btn" href="#" onclick="alert('本番ではここにリンク先を設定します'); return false;">サンプルボタン</a>
  </div>
</body>
</html>
